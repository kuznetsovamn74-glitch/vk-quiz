<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подбор мебели</title>
    
    <!-- Подключаем VK Bridge напрямую из CDN -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            min-height: 100vh;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }
        
        .quiz-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .quiz-subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .options-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }
        
        .option-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .option-card:active {
            transform: scale(0.97);
        }
        
        .option-card.selected {
            border-color: #4CD964;
            background: #f0fff4;
        }
        
        .option-image {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            background: #f0f0f0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        
        .option-content {
            flex: 1;
        }
        
        .option-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1a1a1a;
        }
        
        .option-description {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 16px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CD964;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: #4CD964;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-secondary {
            background: #666;
        }
        
        .button-back {
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .slider-container {
            padding: 10px 0;
        }
        
        .slider {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #4CD964;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .price-display {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin: 16px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .price-value {
            font-size: 32px;
            font-weight: 700;
            color: #4CD964;
            line-height: 1.3;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.25s ease;
        }
        
        .input-field:focus {
            border-color: #4CD964;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4CD964;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons-row {
            display: flex;
            gap: 10px;
        }
        
        .buttons-row .button {
            flex: 1;
        }
        
        .badge {
            display: inline-block;
            background: #4CD964;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
        
        @media (max-width: 400px) {
            .options-grid.two-col {
                grid-template-columns: 1fr;
            }
            
            .quiz-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        const { useState, useEffect } = React;
        const vkBridge = window.vkBridge;
        
        // ==================== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ====================
        const useAppState = () => {
            const [furnitureType, setFurnitureType] = useState(null); // 'kitchen' или 'wardrobe'
            const [quizData, setQuizData] = useState({
                // Общие
                furnitureType: null,
                
                // Кухня
                style: null,
                material: null,
                length: 3,
                
                // Шкаф
                wardrobeType: null, // 'built-in' или 'standalone'
                doorType: null, // 'sliding' или 'hinged'
                width: 2, // ширина шкафа в метрах
                
                // Результат
                priceMin: null,
                priceMax: null,
            });
            const [userData, setUserData] = useState(null);
            
            return { furnitureType, setFurnitureType, quizData, setQuizData, userData, setUserData };
        };
        
        // ==================== КОМПОНЕНТЫ ====================
        
        // Прогресс-бар
        const ProgressBar = ({ currentStep, totalSteps }) => {
            const percentage = (currentStep / totalSteps) * 100;
            return (
                <div>
                    <div className="progress-bar">
                        <div className="progress-fill" style={{ width: percentage + '%' }}></div>
                    </div>
                    <div className="progress-text">Шаг {currentStep} из {totalSteps}</div>
                </div>
            );
        };
        
        // ==================== ЭКРАН 0: ВЫБОР ТИПА МЕБЕЛИ ====================
        const FurnitureTypeScreen = ({ onNext }) => {
            const { furnitureType, setFurnitureType, quizData, setQuizData } = useAppState();
            
            const handleSelect = (type) => {
                setFurnitureType(type);
                setQuizData({ ...quizData, furnitureType: type });
            };
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Подбор мебели</div>
                        <div className="quiz-subtitle">Что хотели бы рассчитать?</div>
                    </div>
                    
                    <div className="options-grid two-col">
                        <div 
                            className={`option-card ${furnitureType === 'kitchen' ? 'selected' : ''}`}
                            onClick={() => handleSelect('kitchen')}
                            style={{ flexDirection: 'column', textAlign: 'center', padding: '20px 16px' }}
                        >
                            <div className="option-image" style={{ width: '80px', height: '80px' }}>🍳</div>
                            <div className="option-content" style={{ textAlign: 'center' }}>
                                <div className="option-title">Кухню</div>
                                <div className="option-description">Рассчитаем стоимость кухни по вашим параметрам</div>
                            </div>
                        </div>
                        
                        <div 
                            className={`option-card ${furnitureType === 'wardrobe' ? 'selected' : ''}`}
                            onClick={() => handleSelect('wardrobe')}
                            style={{ flexDirection: 'column', textAlign: 'center', padding: '20px 16px' }}
                        >
                            <div className="option-image" style={{ width: '80px', height: '80px' }}>🚪</div>
                            <div className="option-content" style={{ textAlign: 'center' }}>
                                <div className="option-title">Шкаф</div>
                                <div className="option-description">Подберем идеальный шкаф под ваше пространство</div>
                            </div>
                        </div>
                    </div>
                    
                    <button 
                        className="button" 
                        disabled={!furnitureType}
                        onClick={onNext}
                    >
                        Продолжить
                    </button>
                </div>
            );
        };
        
        // ==================== ЭКРАН 1 (КУХНЯ): ВЫБОР СТИЛЯ ====================
        const KitchenStyleScreen = ({ onNext, onBack }) => {
            const { quizData, setQuizData } = useAppState();
            const [selectedStyle, setSelectedStyle] = useState(quizData.style || null);
            
            const styles = [
                { id: 'modern', title: 'Современный', description: 'Лаконичные формы, глянец', icon: '🏢' },
                { id: 'classic', title: 'Классический', description: 'Изящество и благородство', icon: '🏛️' },
                { id: 'loft', title: 'Лофт', description: 'Индустриальный шик', icon: '🏭' },
                { id: 'minimal', title: 'Минимализм', description: 'Чистые линии и функциональность', icon: '⬜' },
            ];
            
            const handleSelect = (styleId) => {
                setSelectedStyle(styleId);
                setQuizData({ ...quizData, style: styleId });
            };
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Кухня: стиль</div>
                        <div className="quiz-subtitle">Какой стиль вам ближе?</div>
                    </div>
                    
                    <ProgressBar currentStep={1} totalSteps={3} />
                    
                    <div className="options-grid">
                        {styles.map(style => (
                            <div 
                                key={style.id}
                                className={`option-card ${selectedStyle === style.id ? 'selected' : ''}`}
                                onClick={() => handleSelect(style.id)}
                            >
                                <div className="option-image">{style.icon}</div>
                                <div className="option-content">
                                    <div className="option-title">{style.title}</div>
                                    <div className="option-description">{style.description}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="buttons-row">
                        <button className="button button-secondary" onClick={onBack}>Назад</button>
                        <button 
                            className="button" 
                            disabled={!selectedStyle}
                            onClick={onNext}
                        >
                            Далее
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==================== ЭКРАН 2 (КУХНЯ): ВЫБОР МАТЕРИАЛА ====================
        const KitchenMaterialScreen = ({ onNext, onBack }) => {
            const { quizData, setQuizData } = useAppState();
            const [selectedMaterial, setSelectedMaterial] = useState(quizData.material || null);
            
            const materials = [
                { id: 'plastic', title: 'Пластик', price: 'от 45 000 ₽/м', icon: '🔲' },
                { id: 'enamel', title: 'Эмаль', price: 'от 65 000 ₽/м', icon: '🎨' },
                { id: 'veneer', title: 'Шпон', price: 'от 85 000 ₽/м', icon: '🪵' },
                { id: 'solid', title: 'Массив', price: 'от 120 000 ₽/м', icon: '🌳' },
            ];
            
            const handleSelect = (materialId) => {
                setSelectedMaterial(materialId);
                setQuizData({ ...quizData, material: materialId });
            };
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Кухня: материал</div>
                        <div className="quiz-subtitle">Выберите материал фасада</div>
                    </div>
                    
                    <ProgressBar currentStep={2} totalSteps={3} />
                    
                    <div className="options-grid">
                        {materials.map(material => (
                            <div 
                                key={material.id}
                                className={`option-card ${selectedMaterial === material.id ? 'selected' : ''}`}
                                onClick={() => handleSelect(material.id)}
                            >
                                <div className="option-image">{material.icon}</div>
                                <div className="option-content">
                                    <div className="option-title">{material.title}</div>
                                    <div className="option-description">{material.price}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="buttons-row">
                        <button className="button button-secondary" onClick={onBack}>Назад</button>
                        <button 
                            className="button" 
                            disabled={!selectedMaterial}
                            onClick={onNext}
                        >
                            Далее
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==================== ЭКРАН 3 (КУХНЯ): ВЫБОР РАЗМЕРА ====================
        const KitchenSizeScreen = ({ onNext, onBack }) => {
            const { quizData, setQuizData } = useAppState();
            const [length, setLength] = useState(quizData.length || 3);
            
            const handleLengthChange = (e) => {
                const value = parseFloat(e.target.value);
                setLength(value);
                setQuizData({ ...quizData, length: value });
            };
            
            const estimatedPrice = Math.round(length * 45000);
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Кухня: размер</div>
                        <div className="quiz-subtitle">Какой длины кухня?</div>
                    </div>
                    
                    <ProgressBar currentStep={3} totalSteps={3} />
                    
                    <div className="price-display">
                        <div style={{ fontSize: '44px', fontWeight: 'bold' }}>
                            {length.toFixed(1)} м
                        </div>
                        <div style={{ color: '#666', marginTop: '8px' }}>
                            Примерная стоимость: {estimatedPrice.toLocaleString()} ₽
                        </div>
                    </div>
                    
                    <div className="slider-container">
                        <input 
                            type="range"
                            className="slider"
                            min="1"
                            max="10"
                            step="0.5"
                            value={length}
                            onChange={handleLengthChange}
                        />
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '8px' }}>
                            <span style={{ fontSize: '13px', color: '#666' }}>1 м</span>
                            <span style={{ fontSize: '13px', color: '#666' }}>10 м</span>
                        </div>
                    </div>
                    
                    <div className="buttons-row">
                        <button className="button button-secondary" onClick={onBack}>Назад</button>
                        <button className="button" onClick={onNext}>
                            Рассчитать
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==================== ЭКРАН 1 (ШКАФ): ТИП ШКАФА ====================
        const WardrobeTypeScreen = ({ onNext, onBack }) => {
            const { quizData, setQuizData } = useAppState();
            const [selectedType, setSelectedType] = useState(quizData.wardrobeType || null);
            
            const types = [
                { id: 'built-in', title: 'Встроенный', description: 'Встраивается в нишу, экономит пространство', icon: '🧱' },
                { id: 'standalone', title: 'Отдельно стоящий', description: 'Можно перемещать, классический вариант', icon: '🗄️' },
            ];
            
            const handleSelect = (typeId) => {
                setSelectedType(typeId);
                setQuizData({ ...quizData, wardrobeType: typeId });
            };
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Шкаф: тип</div>
                        <div className="quiz-subtitle">Какой шкаф вам нужен?</div>
                    </div>
                    
                    <ProgressBar currentStep={1} totalSteps={3} />
                    
                    <div className="options-grid">
                        {types.map(type => (
                            <div 
                                key={type.id}
                                className={`option-card ${selectedType === type.id ? 'selected' : ''}`}
                                onClick={() => handleSelect(type.id)}
                            >
                                <div className="option-image">{type.icon}</div>
                                <div className="option-content">
                                    <div className="option-title">{type.title}</div>
                                    <div className="option-description">{type.description}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="buttons-row">
                        <button className="button button-secondary" onClick={onBack}>Назад</button>
                        <button 
                            className="button" 
                            disabled={!selectedType}
                            onClick={onNext}
                        >
                            Далее
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==================== ЭКРАН 2 (ШКАФ): ДВЕРИ ====================
        const WardrobeDoorScreen = ({ onNext, onBack }) => {
            const { quizData, setQuizData } = useAppState();
            const [selectedDoor, setSelectedDoor] = useState(quizData.doorType || null);
            
            const doors = [
                { id: 'sliding', title: 'Шкаф-купе', description: 'Раздвижные двери, экономия места', icon: '🚪' },
                { id: 'hinged', title: 'Распашные', description: 'Классические двери на петлях', icon: '🔓' },
            ];
            
            const handleSelect = (doorId) => {
                setSelectedDoor(doorId);
                setQuizData({ ...quizData, doorType: doorId });
            };
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Шкаф: двери</div>
                        <div className="quiz-subtitle">Какие двери предпочитаете?</div>
                    </div>
                    
                    <ProgressBar currentStep={2} totalSteps={3} />
                    
                    <div className="options-grid">
                        {doors.map(door => (
                            <div 
                                key={door.id}
                                className={`option-card ${selectedDoor === door.id ? 'selected' : ''}`}
                                onClick={() => handleSelect(door.id)}
                            >
                                <div className="option-image">{door.icon}</div>
                                <div className="option-content">
                                    <div className="option-title">{door.title}</div>
                                    <div className="option-description">{door.description}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="buttons-row">
                        <button className="button button-secondary" onClick={onBack}>Назад</button>
                        <button 
                            className="button" 
                            disabled={!selectedDoor}
                            onClick={onNext}
                        >
                            Далее
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==================== ЭКРАН 3 (ШКАФ): ШИРИНА ====================
        const WardrobeWidthScreen = ({ onNext, onBack }) => {
            const { quizData, setQuizData } = useAppState();
            const [width, setWidth] = useState(quizData.width || 2);
            
            const handleWidthChange = (e) => {
                const value = parseFloat(e.target.value);
                setWidth(value);
                setQuizData({ ...quizData, width: value });
            };
            
            const estimatedPrice = Math.round(width * 35000); // Базовая цена за метр шкафа
            
            return (
                <div className="app-container">
                    <div className="quiz-header">
                        <div className="quiz-title">Шкаф: ширина</div>
                        <div className="quiz-subtitle">Укажите примерную ширину</div>
                    </div>
                    
                    <ProgressBar currentStep={3} totalSteps={3} />
                    
                    <div className="price-display">
                        <div style={{ fontSize: '44px', fontWeight: 'bold' }}>
                            {width.toFixed(1)} м
                        </div>
                        <div style={{ color: '#666', marginTop: '8px' }}>
                            Примерная стоимость: {estimatedPrice.toLocaleString()} ₽
                        </div>
                    </div>
                    
                    <div className="slider-container">
                        <input 
                            type="range"
                            className="slider"
                            min="0.5"
                            max="6"
                            step="0.1"
                            value={width}
                            onChange={handleWidthChange}
                        />
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '8px' }}>
                            <span style={{ fontSize: '13px', color: '#666' }}>0.5 м</span>
                            <span style={{ fontSize: '13px', color: '#666' }}>6 м</span>
                        </div>
                    </div>
                    
                    <div className="buttons-row">
                        <button className="button button-secondary" onClick={onBack}>Назад</button>
                        <button className="button" onClick={onNext}>
                            Рассчитать
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==================== ЭКРАН РЕЗУЛЬТАТА ====================
        const ResultScreen = ({ onBack }) => {
            const { furnitureType, quizData, setQuizData, userData, setUserData } = useAppState();
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [submitted, setSubmitted] = useState(false);
            
            useEffect(() => {
                // Получаем данные пользователя VK
                const getUserData = async () => {
                    try {
                        const user = await vkBridge.send('VKWebAppGetUserInfo');
                        setUserData(user);
                        setName(user.first_name + ' ' + user.last_name);
                    } catch (error) {
                        console.error('Error getting user:', error);
                    }
                };
                
                // Рассчитываем цену
                const calculatePrice = () => {
                    let priceMin, priceMax;
                    
                    if (furnitureType === 'kitchen') {
                        const styleMultiplier = { modern: 1, classic: 1.2, loft: 1.1, minimal: 0.9 };
                        const materialMultiplier = { plastic: 1, enamel: 1.3, veneer: 1.5, solid: 2.0 };
                        
                        const multiplier = styleMultiplier[quizData.style] * materialMultiplier[quizData.material];
                        priceMin = Math.round(45000 * quizData.length * multiplier * 0.9);
                        priceMax = Math.round(45000 * quizData.length * multiplier * 1.15);
                    } else {
                        // Расчет для шкафа
                        const typeMultiplier = { 'built-in': 1.1, 'standalone': 1 };
                        const doorMultiplier = { 'sliding': 1.15, 'hinged': 1 };
                        
                        const multiplier = typeMultiplier[quizData.wardrobeType] * doorMultiplier[quizData.doorType];
                        priceMin = Math.round(35000 * quizData.width * multiplier * 0.9);
                        priceMax = Math.round(35000 * quizData.width * multiplier * 1.15);

            const { furnitureType } = useAppState();
            
            useEffect(() => {
                // Инициализация VK Bridge

                // Отправляем событие начала квиза
                vkBridge.send('VKWebAppTrackEvent', {
                    event_name: 'quiz_start',
                    event_data: {},
                });
            }, []);
            
            const goNext = () => {
                const nextMap = {
                    'type': () => furnitureType === 'kitchen' ? 'kitchen_style' : 'wardrobe_type',
                    'kitchen_style': 'kitchen_material',
                    'kitchen_material': 'kitchen_size',
                    'kitchen_size': 'result',
                    'wardrobe_type': 'wardrobe_door',
                    'wardrobe_door': 'wardrobe_width',
                    'wardrobe_width': 'result',
                };
                
                const next = nextMap[step];
                if (typeof next === 'function') {
                    setStep(next());
                } else if (next) {
                    setStep(next);
                }
            };
            
            const goBack = () => {
                const backMap = {
                    'kitchen_style': 'type',
                    'kitchen_material': 'kitchen_style',
                    'kitchen_size': 'kitchen_material',
                    'wardrobe_type': 'type',
                    'wardrobe_door': 'wardrobe_type',
                    'wardrobe_width': 'wardrobe_door',
                    'result': furnitureType === 'kitchen' ? 'kitchen_size' : 'wardrobe_width',
                };
                setStep(backMap[step] || 'type');
            };
            
            return (
                <div>
                    {step === 'type' && <FurnitureTypeScreen onNext={goNext} />}
                    
                    {step === 'kitchen_style' && <KitchenStyleScreen onNext={goNext} onBack={goBack} />}
